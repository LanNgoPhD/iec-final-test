<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEC – FINAL TEST V3</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f6fa;
  margin:0;
  padding:20px;
}
.box {
  max-width:680px;
  margin:30px auto;
  background:white;
  padding:28px;
  border-radius:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
h1 { margin-top:0; }
#progress { color:#666; margin-bottom:20px; }
.label { color:#666; font-size:14px; margin-top:18px; }
#vietnamese {
  font-size:34px;
  font-weight:bold;
  margin-top:8px;
  min-height:42px;
}
#timer {
  font-size:44px;
  font-weight:bold;
  margin-top:8px;
}
#heard, #firstAnswer, #finalAnswer {
  font-size:20px;
  min-height:28px;
  margin-top:6px;
}
#status {
  font-size:20px;
  font-weight:bold;
  min-height:30px;
  margin-top:20px;
}
#restartInfo {
  margin-top:10px;
  font-weight:bold;
}
button {
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}
#startBtn { background:#1a73e8; color:white; }
#stopBtn {
  background:#b3261e;
  color:white;
  display:none;
}
.note {
  margin-top:22px;
  color:#777;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

<h1>IEC – FINAL TEST V3</h1>

<div id="intro">
  START một lần. Nếu muốn sửa câu, nói <b>AGAIN</b>.
</div>

<button id="startBtn" onclick="startTest()">START</button>

<div id="testArea" style="display:none">

  <div id="progress"></div>

  <div class="label">Vietnamese</div>
  <div id="vietnamese">---</div>

  <div class="label">Reaction time</div>
  <div id="timer">--</div>

  <div class="label">Live recognized</div>
  <div id="heard">---</div>

  <div class="label">First answer</div>
  <div id="firstAnswer">---</div>

  <div class="label">Final answer</div>
  <div id="finalAnswer">---</div>

  <div id="restartInfo"></div>
  <div id="status"></div>

  <button id="stopBtn" onclick="stopTest()">STOP TEST</button>

  <div class="note">
    Pilot: AGAIN tối đa 1 lần. Reaction không reset khi AGAIN.
  </div>

</div>
</div>

<script>

// =====================================================
// TEMP CONFIG — SAU KHI PASS SẼ LẤY TỪ GOOGLE SHEET
// =====================================================
let CONFIG = null;

const CONFIG_API =
"https://script.google.com/a/macros/vimaru.edu.vn/s/AKfycby_Z0_bmGoBN7rULALxCR-D8xRHEWa66-CeJNAcHtRaIuNNoeP7A1HJSpNZc4Xi1OUn/exec?api=final-config";
const WORDS_API =
  "https://script.google.com/macros/s/AKfycby_Z0_bmGoBN7rULALxCR-D8xRHEWa66-CeJNAcHtRaIuNNoeP7A1HJSpNZc4Xi1OUn/exec?api=final-test&student=Test%2001&day=1";
let WORDS = [];


// =====================================================
// STATE
// =====================================================

let recognition = null;

let currentIndex = 0;
let testRunning = false;
let responseLocked = false;

let wordStartTime = null;
let firstSpeechTime = null;

let reactionClock = null;
let reactionDeadline = null;
let maxSpeechTimer = null;
let silenceTimer = null;

let currentUtterance = "";
let firstAnswer = "";
let finalAnswer = "";

let restartCount = 0;

let speechSeenInSession = false;
// Kết quả từng từ trong FINAL hiện tại
let finalResults = [];

// =====================================================
// START TEST
// =====================================================

async function startTest() {

  const startBtn =
    document.getElementById("startBtn");

  startBtn.disabled = true;
  startBtn.textContent = "LOADING CONFIG...";

  // LOAD CONFIG FROM GOOGLE SHEET
  try {

    CONFIG = await new Promise(function(resolve, reject) {

  const callbackName =
    "finalConfigCallback_" + Date.now();

  const script =
    document.createElement("script");

  const timer =
    setTimeout(function() {

      cleanup();
      reject(new Error("CONFIG timeout"));

    }, 10000);

  function cleanup() {

    clearTimeout(timer);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }

  window[callbackName] = function(data) {

    cleanup();
    resolve(data);
  };

  script.onerror = function() {

    cleanup();
    reject(new Error("CONFIG JSONP load failed"));
  };

  script.src =
    CONFIG_API +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  document.head.appendChild(script);
});
// LOAD CORE_300 WORDS FROM GOOGLE SHEET
WORDS = await new Promise(function(resolve, reject) {

  const callbackName =
    "finalWordsCallback_" + Date.now();

  const script =
    document.createElement("script");

  const timer =
    setTimeout(function() {

      cleanup();
      reject(new Error("WORDS timeout"));

    }, 10000);

  function cleanup() {

    clearTimeout(timer);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }

window[callbackName] = function(data) {

  cleanup();

  // DAY 7 / DAY 14: không còn RED => nghỉ
  if (data.rest === true) {
    resolve([]);
    return;
  }

  if (!Array.isArray(data.words)) {
    reject(new Error("Invalid FINAL data"));
    return;
  }

  resolve(data.words);
};

  script.onerror = function() {

    cleanup();
    reject(new Error("WORDS JSONP load failed"));
  };

  script.src =
    WORDS_API +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  document.head.appendChild(script);
});

if (!Array.isArray(WORDS)) {
  throw new Error("FINAL WORDS invalid");
}

if (WORDS.length === 0) {
  startBtn.disabled = false;
  startBtn.textContent = "NO RED – REST TODAY";
  return;
}

// Đổi tên STT từ API thành coreId mà engine hiện tại đang dùng
WORDS = WORDS.map(function(w) {
  return {
    coreId: Number(w.stt),
    vietnamese: w.vietnamese,
    english: w.english,
    ipa: w.ipa || "",
    pronNote: w.pronNote || "",
    chapter: w.chapter || "",
    day: w.day
  };
});
// TEMP TEST: chỉ chạy 2 từ
WORDS = WORDS.slice(0, 2);
    const required = [
      "REACTION_LIMIT_SEC",
      "PRON_MIN_SCORE",
      "ENDING_MIN_SCORE",
      "REPAIR_LIMIT",
      "FINAL_RED_LIMIT",
      "FINAL_RANDOM_LIMIT",
      "SILENCE_END_SEC",
      "NEXT_DELAY_SEC",
      "RESULT_DISPLAY_SEC",
      "MAX_SPEECH_SEC",
      "RESTART_WORD",
      "MAX_RESTART",
      "RESTART_POLICY"
    ];

    const missing =
      required.filter(function(key) {
        return (
          CONFIG[key] === undefined ||
          CONFIG[key] === null ||
          CONFIG[key] === ""
        );
      });

    if (missing.length > 0) {
      throw new Error(
        "Missing CONFIG: " + missing.join(", ")
      );
    }

    console.log("FINAL CONFIG FROM SHEET:", CONFIG);

  } catch(error) {

    console.error("CONFIG LOAD ERROR:", error);

    startBtn.disabled = false;
    startBtn.textContent = "START";

    alert(
      "CONFIG ERROR\n\n" +
      "Không tải được cấu hình bài thi.\n" +
      "Bài thi chưa được bắt đầu.\n\n" +
      error.message
    );

    return;
  }

  // CHECK SPEECH RECOGNITION
  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SR) {

    startBtn.disabled = false;
    startBtn.textContent = "START";

    alert("Speech Recognition is not supported.");
    return;
  }

  // START TEST
  startBtn.style.display = "none";

  document.getElementById("testArea")
    .style.display = "block";

  document.getElementById("stopBtn")
    .style.display = "block";

  currentIndex = 0;
  testRunning = true;

  prepareWord();
}


// =====================================================
// PREPARE CORE
// =====================================================

function prepareWord() {

  if (!testRunning) return;

  if (currentIndex >= WORDS.length) {
    finishTest();
    return;
  }

  clearTimers();

  responseLocked = false;

  wordStartTime = null;
  firstSpeechTime = null;

  currentUtterance = "";
  firstAnswer = "";
  finalAnswer = "";

  restartCount = 0;

  document.getElementById("progress").textContent =
    (currentIndex + 1) + " / " + WORDS.length;

  document.getElementById("vietnamese").textContent =
    "WAITING FOR MICROPHONE...";

  document.getElementById("timer").textContent = "--";
  document.getElementById("heard").textContent = "---";
  document.getElementById("firstAnswer").textContent = "---";
  document.getElementById("finalAnswer").textContent = "---";
  document.getElementById("restartInfo").textContent = "";
  document.getElementById("status").textContent =
    "Preparing microphone...";

  /*
    CORE đầu tiên:
    mic READY rồi mới hiện từ và đặt T0.
  */

  startRecognitionSession(true);
}


// =====================================================
// START ONE RECOGNITION SESSION
// =====================================================

function startRecognitionSession(isFirstSession) {

  if (!testRunning || responseLocked) return;

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SR();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  currentUtterance = "";
  speechSeenInSession = false;


  // ---------------------------------------------------
  // MIC READY
  // ---------------------------------------------------

  recognition.onstart = function() {

    if (!testRunning || responseLocked) return;

    if (isFirstSession) {

      const item = WORDS[currentIndex];

      document.getElementById("vietnamese").textContent =
        item.vietnamese;

      /*
        T0 chỉ đặt 1 lần.
      */

      wordStartTime = performance.now();

      startReactionTimer();
    }

    document.getElementById("heard").textContent =
      "Listening...";

    document.getElementById("status").textContent =
      restartCount === 0
        ? "LISTENING"
        : "LISTENING – REANSWER";
  };


  // ---------------------------------------------------
  // SPEECH START
  // ---------------------------------------------------

  recognition.onspeechstart = function() {

    if (!testRunning || responseLocked) return;

    speechSeenInSession = true;

    /*
      Reaction chỉ chốt lần nói đầu tiên của CORE.
      AGAIN tuyệt đối không reset.
    */

    if (firstSpeechTime === null) {

      firstSpeechTime = performance.now();

      const reaction =
        (firstSpeechTime - wordStartTime) / 1000;

      stopReactionTimer();

      document.getElementById("timer").textContent =
        reaction.toFixed(2) + " s";

      startMaxSpeechTimer();
    }
  };


  // ---------------------------------------------------
  // RESULT
  // ---------------------------------------------------

  recognition.onresult = function(event) {

    if (!testRunning || responseLocked) return;

    let bestText = "";

    for (let i = 0;
         i < event.results.length;
         i++) {

      bestText +=
        event.results[i][0].transcript + " ";
    }

    currentUtterance =
      bestText.trim().replace(/\s+/g, " ");

    document.getElementById("heard").textContent =
      currentUtterance || "Listening...";
  };


  // ---------------------------------------------------
  // SPEECH END
  // ---------------------------------------------------

  recognition.onspeechend = function() {

    if (!testRunning || responseLocked) return;

    document.getElementById("status").textContent =
      "Processing...";
  };


  // ---------------------------------------------------
  // ERROR
  // ---------------------------------------------------

  recognition.onerror = function(event) {

    if (!testRunning || responseLocked) return;

    if (event.error === "no-speech") {
      return;
    }

    document.getElementById("status").textContent =
      "MIC ERROR: " + event.error;
  };


  // ---------------------------------------------------
  // SESSION END
  // ---------------------------------------------------

  recognition.onend = function() {

    if (!testRunning || responseLocked) return;

    /*
      Chưa hề nói.
    */

    if (!speechSeenInSession) {

      if (firstSpeechTime === null) {

        const elapsed =
          wordStartTime === null
            ? 0
            : (performance.now() - wordStartTime) / 1000;

        if (elapsed < CONFIG.REACTION_LIMIT_SEC) {

          /*
            Mic tự đóng sớm.
            Mở lại nhưng KHÔNG reset T0.
          */

          startRecognitionSession(false);
          return;
        }

        lockResponse("REACTION");
        return;
      }

      /*
        Đã có answer trước đó nhưng session mới
        không nghe được gì.
      */

      finalizeCurrentAnswer();
      return;
    }

    processUtterance(currentUtterance);
  };


  try {
    recognition.start();
  } catch(e) {
    document.getElementById("status").textContent =
      "START ERROR: " + e.message;
  }
}


// =====================================================
// PROCESS ONE UTTERANCE
// =====================================================

function processUtterance(text) {

  if (!testRunning || responseLocked) return;

  const cleaned =
    String(text || "")
      .trim()
      .replace(/\s+/g, " ");

  if (!cleaned) {

    finalizeCurrentAnswer();
    return;
  }

  const restartWord =
    CONFIG.RESTART_WORD.toLowerCase();

  const normalized =
    cleaned.toLowerCase();


  // ===================================================
  // CASE 1:
  // "AGAIN" đứng một mình
  // ===================================================

  if (normalized === restartWord) {

    handleAgain();
    return;
  }


  // ===================================================
  // CASE 2:
  // Recognition trả cùng một utterance:
  // "two stroke engine again"
  // ===================================================

  const tokens =
    cleaned.split(/\s+/);

  const againIndex =
    tokens.findIndex(function(token) {

      return cleanToken(token).toLowerCase() === restartWord;

    });


  if (againIndex >= 0) {

    const beforeAgain =
      tokens
        .slice(0, againIndex)
        .join(" ")
        .trim();

    const afterAgain =
      tokens
        .slice(againIndex + 1)
        .join(" ")
        .trim();


    if (beforeAgain && !firstAnswer) {

      firstAnswer = beforeAgain;

      document.getElementById("firstAnswer").textContent =
        firstAnswer;
    }


    if (restartCount >= CONFIG.MAX_RESTART) {

      document.getElementById("restartInfo").textContent =
        "RESTART LIMIT REACHED";

      /*
        Không cho restart lần nữa.
        Lấy phần hợp lệ hiện có.
      */

      if (!finalAnswer) {
        finalAnswer = beforeAgain || cleaned;
      }

      finalizeCurrentAnswer();
      return;
    }


    restartCount++;

    document.getElementById("restartInfo").textContent =
      "RESTART = " + restartCount;


    /*
      Nếu recognition đã nghe luôn answer mới
      phía sau AGAIN:
      dùng luôn phần sau làm final.
    */

    if (afterAgain) {

      finalAnswer = afterAgain;

      document.getElementById("finalAnswer").textContent =
        finalAnswer;

      finalizeCurrentAnswer();
      return;
    }


    /*
      Nếu AGAIN ở cuối:
      mở session mới để nghe câu sửa.
    */

    document.getElementById("heard").textContent =
      "AGAIN → answer again";

    document.getElementById("status").textContent =
      "REANSWER";

    startRecognitionSession(false);
    return;
  }


  // ===================================================
  // NORMAL ANSWER
  // ===================================================

  if (restartCount === 0) {

    /*
      Đây là answer đầu tiên.
      Chưa khóa ngay:
      mở thêm một recognition session ngắn
      để SV có thể nói AGAIN.
    */

    firstAnswer = cleaned;

    document.getElementById("firstAnswer").textContent =
      firstAnswer;

    finalAnswer = cleaned;

    document.getElementById("finalAnswer").textContent =
      finalAnswer;

    document.getElementById("status").textContent =
      "Say AGAIN now if you want to correct";

    /*
      Cửa nghe tiếp.
      SILENCE_END_SEC được dùng để tránh chờ vô hạn.
    */

    clearTimeout(silenceTimer);

    silenceTimer = setTimeout(function() {

      if (!responseLocked) {
        finalizeCurrentAnswer();
      }

    }, CONFIG.SILENCE_END_SEC * 1000);

    /*
      Đồng thời mở recognition mới.
      Nếu SV nói AGAIN trước khi timer hết,
      session này sẽ bắt được.
    */

    startRecognitionSession(false);

    return;
  }


  // ===================================================
  // ANSWER AFTER AGAIN
  // ===================================================

  finalAnswer = cleaned;

  document.getElementById("finalAnswer").textContent =
    finalAnswer;

  finalizeCurrentAnswer();
}


// =====================================================
// AGAIN STANDALONE
// =====================================================

function handleAgain() {

  if (restartCount >= CONFIG.MAX_RESTART) {

    document.getElementById("restartInfo").textContent =
      "RESTART LIMIT REACHED";

    finalizeCurrentAnswer();
    return;
  }

  restartCount++;

  clearTimeout(silenceTimer);

  document.getElementById("restartInfo").textContent =
    "RESTART = " + restartCount;

  /*
    Không reset firstSpeechTime.
    Không reset wordStartTime.
  */

  finalAnswer = "";

  document.getElementById("finalAnswer").textContent =
    "WAITING FOR REANSWER...";

  document.getElementById("heard").textContent =
    "AGAIN → answer again";

  document.getElementById("status").textContent =
    "REANSWER";

  startRecognitionSession(false);
}


// =====================================================
// FINALIZE
// =====================================================

function finalizeCurrentAnswer() {

  if (!testRunning || responseLocked) return;

  if (!finalAnswer && currentUtterance) {
    finalAnswer = currentUtterance;
  }

  document.getElementById("finalAnswer").textContent =
    finalAnswer || "(no answer)";

  lockResponse("ANSWER");
}


// =====================================================
// REACTION TIMER
// =====================================================

function startReactionTimer() {

  stopReactionTimer();

  reactionClock = setInterval(function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime !== null ||
        wordStartTime === null) {
      return;
    }

    const elapsed =
      (performance.now() - wordStartTime) / 1000;

    document.getElementById("timer").textContent =
      elapsed.toFixed(2) + " s";

  }, 50);


  reactionDeadline = setTimeout(function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime !== null) {
      return;
    }

    document.getElementById("timer").textContent =
      CONFIG.REACTION_LIMIT_SEC.toFixed(2) + " s";

    lockResponse("REACTION");

  }, CONFIG.REACTION_LIMIT_SEC * 1000);
}


function stopReactionTimer() {

  clearInterval(reactionClock);
  clearTimeout(reactionDeadline);

  reactionClock = null;
  reactionDeadline = null;
}


// =====================================================
// MAX SPEECH
// =====================================================

function startMaxSpeechTimer() {

  clearTimeout(maxSpeechTimer);

  maxSpeechTimer = setTimeout(function() {

    if (!responseLocked) {
      lockResponse("MAX_SPEECH");
    }

  }, CONFIG.MAX_SPEECH_SEC * 1000);
}


// =====================================================
// LOCK CORE
// =====================================================

function lockResponse(reason) {

  if (!testRunning || responseLocked) return;

  responseLocked = true;

  clearTimers();

  try {
    if (recognition) recognition.abort();
  } catch(e) {}


  let status = "";

  if (reason === "REACTION") {

    status = "RED – REACTION";

    document.getElementById("heard").textContent =
      "(no answer)";

    document.getElementById("finalAnswer").textContent =
      "(no answer)";

  } else if (!finalAnswer) {

    status = "RED – NO ANSWER";

  } else if (
    restartCount > 0 &&
    CONFIG.RESTART_POLICY === "FAIL"
  ) {

    status = "RED – RESTART";

 } else {

  const expected = WORDS[currentIndex].english;
alert("CHECK: [" + finalAnswer + "] === [" + expected + "] | INDEX=" + currentIndex + " | CORE=" + WORDS[currentIndex].coreId);
  if (isCorrectAnswer(finalAnswer, expected)) {
    status = "PASS";
  } else {
    status = "RED - WRONG";
  }
}


  document.getElementById("status").textContent =
    status;


  const reaction =
    firstSpeechTime !== null && wordStartTime !== null
      ? (firstSpeechTime - wordStartTime) / 1000
      : null;


finalResults.push({
  studentId: "Test 01",
  coreId: WORDS[currentIndex].coreId,
  english: WORDS[currentIndex].english,
  source: WORDS[currentIndex].source || "",
  reaction: reaction,
  firstAnswer: firstAnswer || "",
  finalAnswer: finalAnswer || "",
  restartCount: restartCount,
  restartPolicy: CONFIG.RESTART_POLICY,
  result: status
});

  setTimeout(function() {

    if (!testRunning) return;

    setTimeout(function() {

      if (!testRunning) return;

      currentIndex++;

      prepareWord();

    }, CONFIG.NEXT_DELAY_SEC * 1000);

  }, CONFIG.RESULT_DISPLAY_SEC * 1000);
}


// =====================================================
// UTIL
// =====================================================
function normalizeAnswer(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, "")
    .replace(/\s+/g, " ");
}

function isCorrectAnswer(answer, expected) {
  return normalizeAnswer(answer) === normalizeAnswer(expected);
}
function cleanToken(token) {

  return String(token || "")
    .replace(/^[^\w]+|[^\w]+$/g, "");
}


function clearTimers() {

  stopReactionTimer();

  clearTimeout(maxSpeechTimer);
  clearTimeout(silenceTimer);

  maxSpeechTimer = null;
  silenceTimer = null;
}


// =====================================================
// STOP
// =====================================================

function stopTest() {

  testRunning = false;

  clearTimers();

  try {
    if (recognition) recognition.abort();
  } catch(e) {}

  document.getElementById("status").textContent =
    "TEST STOPPED";

  document.getElementById("stopBtn").style.display =
    "none";
}


// =====================================================
// FINISH
// =====================================================
function submitFinalResults() {

  const payload = {
    api: "final-submit",
    studentId: "Test 01",
    day: Number(WORDS[0] && WORDS[0].day) || 1,
    results: finalResults
  };

  const form = document.createElement("form");

  form.method = "POST";
  form.action =
    "https://script.google.com/macros/s/AKfycby_Z0_bmGoBN7rULALxCR-D8xRHEWa66-CeJNAcHtRaIuNNoeP7A1HJSpNZc4Xi1OUn/exec";

  form.target = "finalSubmitFrame";

  const input = document.createElement("input");

  input.type = "hidden";
  input.name = "payload";
  input.value = JSON.stringify(payload);

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();
  form.remove();
}
function finishTest() {

  testRunning = false;

  clearTimers();

  try {
    if (recognition) recognition.abort();
  } catch(e) {}

  document.getElementById("progress").textContent =
    WORDS.length + " / " + WORDS.length;

  document.getElementById("vietnamese").textContent =
    "FINISHED";

  document.getElementById("timer").textContent = "";

  document.getElementById("heard").textContent = "";
  document.getElementById("firstAnswer").textContent = "";
  document.getElementById("finalAnswer").textContent = "";
  document.getElementById("restartInfo").textContent = "";

  document.getElementById("status").textContent =
    "FINAL TEST COMPLETE";
submitFinalResults();

  document.getElementById("stopBtn").style.display =
    "none";
}

</script>
<iframe
  name="finalSubmitFrame"
  style="display:none;">
</iframe>
</body>
</html>
