<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEC – FINAL TEST V2</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}
.box {
  max-width: 680px;
  margin: 30px auto;
  background: white;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
}
h1 { margin-top: 0; }

#progress {
  color: #666;
  margin-bottom: 20px;
}
.label {
  color: #666;
  font-size: 14px;
  margin-top: 18px;
}
#vietnamese {
  font-size: 34px;
  font-weight: bold;
  margin-top: 8px;
  min-height: 42px;
}
#timer {
  font-size: 44px;
  font-weight: bold;
  margin-top: 8px;
}
#heard {
  font-size: 22px;
  min-height: 32px;
  margin-top: 8px;
}
#status {
  font-size: 19px;
  font-weight: bold;
  min-height: 30px;
  margin-top: 20px;
}
button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}
#startBtn {
  background: #1a73e8;
  color: white;
}
#stopBtn {
  background: #b3261e;
  color: white;
  display: none;
}
.note {
  margin-top: 22px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="box">

<h1>IEC – FINAL TEST V2</h1>

<div id="intro">
  Nhấn START một lần.<br>
  Microphone phải sẵn sàng trước khi từ xuất hiện.
</div>

<button id="startBtn" onclick="startTest()">START</button>

<div id="testArea" style="display:none">

  <div id="progress"></div>

  <div class="label">Vietnamese</div>
  <div id="vietnamese">WAITING FOR MICROPHONE...</div>

  <div class="label">Reaction time</div>
  <div id="timer">--</div>

  <div class="label">Recognized</div>
  <div id="heard">---</div>

  <div id="status"></div>

  <button id="stopBtn" onclick="stopTest()">STOP TEST</button>

  <div class="note">
    Engine test: MIC READY → WORD → REACTION → SPEECH → AUTO NEXT
  </div>

</div>

</div>

<script>

// =====================================================
// TEMP CONFIG
// =====================================================

const CONFIG = {
  REACTION_LIMIT_SEC: 4,
  NEXT_DELAY_SEC: 0.7,
  RESULT_DISPLAY_SEC: 0.7,
  MAX_SPEECH_SEC: 8
};


// =====================================================
// TEST DATA
// =====================================================

const WORDS = [
  {
    coreId: 2,
    vietnamese: "Động cơ phụ",
    english: "Auxiliary engine"
  },
  {
    coreId: 6,
    vietnamese: "Động cơ 4 kỳ",
    english: "Four-stroke engine"
  },
  {
    coreId: 7,
    vietnamese: "Đường kính xi-lanh",
    english: "Cylinder bore"
  }
];


// =====================================================
// STATE
// =====================================================

let recognition = null;

let currentIndex = 0;
let testRunning = false;
let responseLocked = false;

let wordVisible = false;

let wordStartTime = null;
let firstSpeechTime = null;

let finalTranscript = "";
let interimTranscript = "";

let reactionClock = null;
let reactionDeadline = null;
let maxSpeechTimer = null;


// =====================================================
// START TEST
// =====================================================

function startTest() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech Recognition is not supported.");
    return;
  }

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("testArea").style.display = "block";
  document.getElementById("stopBtn").style.display = "block";

  currentIndex = 0;
  testRunning = true;

  prepareCurrentWord();
}


// =====================================================
// PREPARE ONE CORE
// =====================================================

function prepareCurrentWord() {

  if (!testRunning) return;

  if (currentIndex >= WORDS.length) {
    finishTest();
    return;
  }

  clearTimers();

  responseLocked = false;
  wordVisible = false;

  wordStartTime = null;
  firstSpeechTime = null;

  finalTranscript = "";
  interimTranscript = "";

  document.getElementById("progress").textContent =
    (currentIndex + 1) + " / " + WORDS.length;

  /*
    QUAN TRỌNG:
    Chưa cho SV nhìn thấy từ.
  */

  document.getElementById("vietnamese").textContent =
    "WAITING FOR MICROPHONE...";

  document.getElementById("timer").textContent = "--";
  document.getElementById("heard").textContent = "---";

  document.getElementById("status").textContent =
    "Preparing microphone...";

  createRecognitionSession();
}


// =====================================================
// ONE RECOGNITION SESSION PER CORE
// =====================================================

function createRecognitionSession() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";

  /*
    Mỗi CORE là một recognition session riêng.
  */
  recognition.continuous = false;

  /*
    Giữ interim để nhìn được máy đang nghe gì.
  */
  recognition.interimResults = true;

  recognition.maxAlternatives = 1;


  // ===================================================
  // MIC THỰC SỰ READY
  // ===================================================

  recognition.onstart = function() {

    if (!testRunning || responseLocked) return;

    /*
      CHỈ BÂY GIỜ MỚI HIỆN TỪ.
    */

    const item = WORDS[currentIndex];

    document.getElementById("vietnamese").textContent =
      item.vietnamese;

    document.getElementById("heard").textContent =
      "Listening...";

    document.getElementById("status").textContent =
      "LISTENING";

    /*
      T0 bắt đầu SAU KHI MIC READY
      và đúng lúc từ được hiển thị.
    */

    wordStartTime = performance.now();
    wordVisible = true;

    startReactionTimer();
  };


  // ===================================================
  // SV BẮT ĐẦU NÓI
  // ===================================================

  recognition.onspeechstart = function() {

    if (!testRunning ||
        responseLocked ||
        !wordVisible) {
      return;
    }

    if (firstSpeechTime === null) {

      firstSpeechTime = performance.now();

      const reaction =
        (firstSpeechTime - wordStartTime) / 1000;

      stopReactionTimer();

      document.getElementById("timer").textContent =
        reaction.toFixed(2) + " s";

      /*
        MAX SPEECH tính từ lúc SV bắt đầu nói.
      */

      maxSpeechTimer = setTimeout(function() {

        if (!responseLocked) {
          lockResponse("MAX_SPEECH");
        }

      }, CONFIG.MAX_SPEECH_SEC * 1000);
    }
  };


  // ===================================================
  // TRANSCRIPT
  // ===================================================

  recognition.onresult = function(event) {

    if (!testRunning || responseLocked) return;

    let interim = "";

    for (let i = event.resultIndex;
         i < event.results.length;
         i++) {

      const text =
        event.results[i][0].transcript.trim();

      if (event.results[i].isFinal) {

        finalTranscript += text + " ";

      } else {

        interim += text + " ";
      }
    }

    interimTranscript = interim.trim();

    const display =
      (finalTranscript + interimTranscript).trim();

    document.getElementById("heard").textContent =
      display || "Listening...";
  };


  // ===================================================
  // SPEECH RECOGNITION ĐÃ KẾT THÚC CÂU
  // ===================================================

  recognition.onspeechend = function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime === null) {
      return;
    }

    /*
      Với continuous=false, cho engine kết thúc câu.
      onend sẽ xử lý response.
    */

    document.getElementById("status").textContent =
      "Processing...";
  };


  // ===================================================
  // ERROR
  // ===================================================

  recognition.onerror = function(event) {

    if (!testRunning || responseLocked) return;

    if (event.error === "no-speech") {

      /*
        Nếu recognition tự đóng trước deadline,
        ta xử lý ở onend.
      */

      return;
    }

    responseLocked = true;

    clearTimers();

    document.getElementById("status").textContent =
      "MIC ERROR: " + event.error;
  };


  // ===================================================
  // SESSION ENDED
  // ===================================================

  recognition.onend = function() {

    if (!testRunning || responseLocked) return;

    /*
      Trường hợp recognition tự đóng nhưng SV chưa nói,
      mà vẫn còn trong 4 giây:
      tạo session mới nhưng KHÔNG reset reaction T0.
    */

    if (firstSpeechTime === null) {

      const elapsed =
        wordStartTime === null
          ? 0
          : (performance.now() - wordStartTime) / 1000;

      if (elapsed < CONFIG.REACTION_LIMIT_SEC) {

        restartListeningWithoutReset();

        return;
      }

      lockResponse("REACTION");
      return;
    }

    /*
      Có speech rồi:
      session kết thúc = response hoàn tất.
    */

    lockResponse("SPEECH_END");
  };


  // ===================================================
  // START MIC
  // ===================================================

  try {

    recognition.start();

  } catch (e) {

    document.getElementById("status").textContent =
      "START ERROR: " + e.message;
  }
}


// =====================================================
// RESTART MIC BEFORE SPEECH
// KHÔNG RESET T0
// =====================================================

function restartListeningWithoutReset() {

  if (!testRunning || responseLocked) return;

  const oldStart = wordStartTime;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {

    /*
      Không hiện lại từ.
      Không reset wordStartTime.
    */

    wordStartTime = oldStart;

    document.getElementById("status").textContent =
      "LISTENING";
  };

  recognition.onspeechstart = function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime !== null) {
      return;
    }

    firstSpeechTime = performance.now();

    const reaction =
      (firstSpeechTime - wordStartTime) / 1000;

    stopReactionTimer();

    document.getElementById("timer").textContent =
      reaction.toFixed(2) + " s";

    maxSpeechTimer = setTimeout(function() {

      if (!responseLocked) {
        lockResponse("MAX_SPEECH");
      }

    }, CONFIG.MAX_SPEECH_SEC * 1000);
  };

  recognition.onresult = function(event) {

    if (!testRunning || responseLocked) return;

    let interim = "";

    for (let i = event.resultIndex;
         i < event.results.length;
         i++) {

      const text =
        event.results[i][0].transcript.trim();

      if (event.results[i].isFinal) {

        finalTranscript += text + " ";

      } else {

        interim += text + " ";
      }
    }

    interimTranscript = interim.trim();

    const display =
      (finalTranscript + interimTranscript).trim();

    document.getElementById("heard").textContent =
      display || "Listening...";
  };

  recognition.onspeechend = function() {

    if (firstSpeechTime !== null) {

      document.getElementById("status").textContent =
        "Processing...";
    }
  };

  recognition.onerror = function(event) {

    if (event.error !== "no-speech") {

      document.getElementById("status").textContent =
        "MIC ERROR: " + event.error;
    }
  };

  recognition.onend = function() {

    if (!testRunning || responseLocked) return;

    if (firstSpeechTime === null) {

      const elapsed =
        (performance.now() - wordStartTime) / 1000;

      if (elapsed < CONFIG.REACTION_LIMIT_SEC) {

        restartListeningWithoutReset();

      } else {

        lockResponse("REACTION");
      }

      return;
    }

    lockResponse("SPEECH_END");
  };

  try {
    recognition.start();
  } catch(e) {}
}


// =====================================================
// REACTION TIMER
// =====================================================

function startReactionTimer() {

  stopReactionTimer();

  reactionClock = setInterval(function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime !== null ||
        wordStartTime === null) {

      return;
    }

    const elapsed =
      (performance.now() - wordStartTime) / 1000;

    document.getElementById("timer").textContent =
      elapsed.toFixed(2) + " s";

  }, 50);


  reactionDeadline = setTimeout(function() {

    if (!testRunning ||
        responseLocked ||
        firstSpeechTime !== null) {
      return;
    }

    document.getElementById("timer").textContent =
      CONFIG.REACTION_LIMIT_SEC.toFixed(2) + " s";

    lockResponse("REACTION");

  }, CONFIG.REACTION_LIMIT_SEC * 1000);
}


function stopReactionTimer() {

  clearInterval(reactionClock);
  clearTimeout(reactionDeadline);

  reactionClock = null;
  reactionDeadline = null;
}


// =====================================================
// LOCK RESPONSE
// =====================================================

function lockResponse(reason) {

  if (!testRunning || responseLocked) return;

  responseLocked = true;

  clearTimers();

  /*
    QUAN TRỌNG:
    Interim cuối cùng đôi khi là transcript tốt nhất
    ngay trước khi recognition đóng.
  */

  let answer =
    (finalTranscript + " " + interimTranscript)
      .trim()
      .replace(/\s+/g, " ");

  const item = WORDS[currentIndex];

  let reaction = null;

  if (firstSpeechTime !== null &&
      wordStartTime !== null) {

    reaction =
      (firstSpeechTime - wordStartTime) / 1000;
  }


  let status;

  if (reason === "REACTION") {

    status = "RED – REACTION";

    answer = "";

  } else if (!answer) {

    status = "RED – NO ANSWER";

  } else {

    /*
      CHƯA CHẤM PRONUNCIATION.
      CAPTURED chỉ nghĩa là thu được response.
    */

    status = "CAPTURED";
  }


  if (answer) {

    document.getElementById("heard").textContent =
      answer;

  } else {

    document.getElementById("heard").textContent =
      "(no answer)";
  }

  document.getElementById("status").textContent =
    status;


  console.log({
    coreId: item.coreId,
    expected: item.english,
    recognized: answer,
    reaction: reaction,
    reason: reason
  });


  /*
    Đóng session hiện tại.
  */

  try {
    recognition.abort();
  } catch(e) {}


  /*
    RESULT DISPLAY + NEXT DELAY
  */

  setTimeout(function() {

    if (!testRunning) return;

    setTimeout(function() {

      if (!testRunning) return;

      currentIndex++;

      prepareCurrentWord();

    }, CONFIG.NEXT_DELAY_SEC * 1000);

  }, CONFIG.RESULT_DISPLAY_SEC * 1000);
}


// =====================================================
// FINISH
// =====================================================

function finishTest() {

  testRunning = false;

  clearTimers();

  try {
    if (recognition) recognition.abort();
  } catch(e) {}

  document.getElementById("progress").textContent =
    WORDS.length + " / " + WORDS.length;

  document.getElementById("vietnamese").textContent =
    "FINISHED";

  document.getElementById("timer").textContent = "";

  document.getElementById("heard").textContent = "";

  document.getElementById("status").textContent =
    "FINAL TEST COMPLETE";

  document.getElementById("stopBtn").style.display =
    "none";
}


// =====================================================
// STOP
// =====================================================

function stopTest() {

  testRunning = false;

  clearTimers();

  try {
    if (recognition) recognition.abort();
  } catch(e) {}

  document.getElementById("status").textContent =
    "TEST STOPPED";

  document.getElementById("stopBtn").style.display =
    "none";
}


// =====================================================
// CLEAR TIMERS
// =====================================================

function clearTimers() {

  stopReactionTimer();

  clearTimeout(maxSpeechTimer);

  maxSpeechTimer = null;
}

</script>

</body>
</html>
